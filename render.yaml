services:
  - type: web
    name: mm-bruiloft-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn backend:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CREDENTIALS
        sync: false
      - key: SPREADSHEET_ID
        sync: false
