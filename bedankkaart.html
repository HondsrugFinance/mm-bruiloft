<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedankkarte — Mike & Martine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #e8e3d4;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #1D1C19;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      gap: 24px;
    }
    .balk { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .knop {
      font-family: inherit;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 600;
      background: #1D1C19;
      color: #F6F1E6;
      border: none;
      padding: 12px 22px;
      cursor: pointer;
    }
    .knop:disabled { opacity: 0.5; }

    /* Visitekaartje formaat: 90 x 50 mm */
    .kaartje {
      width: 90mm;
      height: 50mm;
      background: #F6F1E6;
      padding: 6mm;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }
    .rand {
      width: 100%;
      height: 100%;
      border: 1px dotted #1D1C19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6mm;
    }
    .monogram {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 2px;
      margin-bottom: 3mm;
    }
    .script {
      font-family: 'Pinyon Script', cursive;
      font-size: 16px;
      line-height: 1.4;
      margin-bottom: 2mm;
      color: #1D1C19;
    }
    .tekst {
      font-size: 8.5px;
      line-height: 1.5;
      color: #5C5C5C;
      letter-spacing: 0.5px;
    }

    @media print {
      body { background: #F6F1E6; padding: 0; }
      .balk { display: none; }
      .kaartje {
        box-shadow: none;
        background: #F6F1E6 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        color-adjust: exact;
      }
      .rand {
        background: #F6F1E6 !important;
        border-color: #1D1C19 !important;
      }
      @page { size: 90mm 50mm; margin: 0; background: #F6F1E6; }
    }
  </style>
</head>
<body>

<button class="knop" id="btn-print">Print (dubbelzijdig)</button>

<div class="kaartje">
  <div class="rand">
    <div class="monogram">M | M</div>
    <div class="script">Dank je wel!</div>
    <div class="tekst">
      Voor het helpen van het vastleggen van onze onvergetelijke dag.<br>
      Jouw foto's maken deze dag voor altijd bijzonder.
    </div>
  </div>
</div>

<script>
document.getElementById("btn-print").addEventListener("click", () => window.print());
</script>

</body>
</html>
