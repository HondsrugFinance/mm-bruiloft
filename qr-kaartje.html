<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR — Mike & Martine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #e8e3d4;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #1D1C19;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      gap: 24px;
    }
    .balk { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    input[type="url"] {
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid #1D1C19;
      background: #F6F1E6;
      width: min(400px, 90vw);
      color: #1D1C19;
    }
    .knop {
      font-family: inherit;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 600;
      background: #1D1C19;
      color: #F6F1E6;
      border: none;
      padding: 12px 22px;
      cursor: pointer;
    }
    .knop:disabled { opacity: 0.5; }

    /* A6 kaartje: 105 x 148 mm */
    .kaartje {
      width: 105mm;
      height: 148mm;
      background: #F6F1E6;
      padding: 9mm;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }
    .rand {
      width: 100%;
      height: 100%;
      border: 1px dotted #1D1C19;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8mm 6mm 7mm;
    }
    .monogram {
      font-size: 30px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 4mm 0 3mm;
    }
    .monogram .bar {
      width: 1.2px;
      height: 44px;
      background: #1D1C19;
    }
    .script {
      font-family: 'Pinyon Script', cursive;
      font-size: 18px;
      margin: 2mm 0;
      color: #1D1C19;
    }
    .caps {
      letter-spacing: 2.6px;
      text-transform: uppercase;
      font-size: 9.5px;
      font-weight: 600;
      color: #5C5C5C;
      line-height: 2.1;
      margin: 3mm 0;
    }
    #qr {
      margin: 5mm 0 4mm;
      padding: 3px;
      background: #fff;
      border: 1px solid #1D1C19;
    }
    #qr img, #qr canvas {
      display: block;
    }
    .vulling { flex: 1; }
    .ondertekst {
      font-size: 9px;
      color: #5C5C5C;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1.8;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .balk { display: none; }
      .kaartje { box-shadow: none; }
      @page { size: A6; margin: 0; }
    }
  </style>
</head>
<body>

<div class="balk">
  <input type="url" id="url-input" placeholder="https://hondsrugfinance.github.io/mm-bruiloft/" value="">
  <button class="knop" id="btn-qr">Maak QR</button>
  <button class="knop" id="btn-print">Print</button>
</div>

<div class="kaartje">
  <div class="rand">
    <div class="monogram">M<span class="bar"></span>M</div>
    <div class="script">Jij bent onze fotograaf!</div>

    <div id="qr"></div>

    <div class="caps">
      Scan • zet op beginscherm<br>
      maak 10 foto's
    </div>

    <div class="vulling"></div>

    <div class="ondertekst">
      Mike & Martine<br>
      20 juni 2026
    </div>
  </div>
</div>

<script>
document.getElementById("btn-qr").addEventListener("click", () => {
  const url = document.getElementById("url-input").value.trim();
  if (!url) return;
  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), {
    text: url,
    width: 140,
    height: 140,
    correctLevel: QRCode.CorrectLevel.M,
    colorDark: "#1D1C19",
    colorLight: "#ffffff"
  });
});

document.getElementById("btn-print").addEventListener("click", () => window.print());

// Auto-generate example QR on load
window.addEventListener("load", () => {
  const defaultUrl = "https://hondsrugfinance.github.io/mm-bruiloft/";
  document.getElementById("url-input").value = defaultUrl;
  document.getElementById("url-input").dispatchEvent(new Event("change"));
});
</script>

</body>
</html>
